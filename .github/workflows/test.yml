name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux runs the bash >= 4 tests; macOS has the stock bash 3.2
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Secure zsh's completion directories
        # compinit refuses group- or world-writable directories and the runner image has some
        if: runner.os == 'Linux'
        run: zsh -c 'autoload -Uz compaudit; compaudit' | xargs -r sudo chmod g-w,o-w
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          sudo "$RUNNER_TEMP/bats/install.sh" /usr/local
      - name: Show versions
        # The tests only put /usr/bin and /bin on PATH, so jq and python3 must be there
        run: |
          bats --version
          bash --version | head -1
          zsh --version
          /usr/bin/jq --version
          /usr/bin/python3 --version
      - run: bats tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        # Pinned: findings differ between versions
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck --version
      - run: tests/lint
